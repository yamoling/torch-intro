[project]
name = "torch-intro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "marimo>=0.25.0",
  "matplotlib>=3.11.2",
  "numpy>=2.5.3",
  "torch>=2.14.0",
]

[project.scripts]
notebook = "tools:run_notebook"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tools.py"]
